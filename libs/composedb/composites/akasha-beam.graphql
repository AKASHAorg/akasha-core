  @createIndex(fields:[{path:["active"]}, {path:["createdAt"]}, {path:["nsfw"]}]){
    author: DID! @documentAccount
    content: [BeamBlockRecord!]! @list(maxLength: 10) @immutable
    tags: [BeamLabeled] @list(maxLength: 10) @immutable
