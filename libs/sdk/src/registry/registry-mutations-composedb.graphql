fragment AkashaAppFragmentM on AkashaApp{
  id
  applicationType
  description
  license
  name
  displayName
  keywords
  releases(first: 5, sorting: {createdAt: DESC} ){
    edges {
      node {
        id
        createdAt
        source
        version
      }
      cursor
    }
  }
  releasesCount
  author {
    id
    isViewer
    akashaProfile {
      ...UserProfileFragmentM
    }
  }
  contributors {
    id
    isViewer
    akashaProfile {
      ...UserProfileFragmentM
    }
  }
}

fragment AppReleaseFragmentM on AkashaAppRelease{
  application {
    ...AkashaAppFragmentM
  }
  applicationID
  id
  source
  version
  createdAt
}

mutation SetAppRelease($i: SetAkashaAppReleaseInput!){
  setAkashaAppRelease(input: $i){
    document {
      ...AppReleaseFragmentM
    }
    clientMutationId
  }
}


mutation UpdateAppRelease($i: UpdateAkashaAppReleaseInput!){
  updateAkashaAppRelease(input: $i){
    document {
      ...AppReleaseFragmentM
    }
    clientMutationId
  }
}

mutation CreateApp($i: SetAkashaAppInput!){
  setAkashaApp(input: $i){
    document {
      ...AkashaAppFragmentM
    }
    clientMutationId
  }
}

mutation UpdateApp($i: UpdateAkashaAppInput!){
  updateAkashaApp(input: $i){
    document {
      ...AkashaAppFragmentM
    }
    clientMutationId
  }
}

fragment AkashaWorldFragmentM on AkashaWorld{
  id
  icon {
    default {
      sizes
      src
      width
      height
    }
  }
  active
  name
  instanceURL
  createdAt
  creator {
    id
  }
  extensionPublishers {
    id
    akashaProfile {
      name
      id
      avatar {
        default {
          src
          width
          height
        }
      }
    }
  }
}

fragment AkashaWorldConfigM on AkashaWorldConfig{
  id
  worldID
  creator {
    id
  }
  active
  createdAt
  homepageExtension
  registryExtension
  layoutExtension

}

fragment AkashaWorldConfigExtensionM on AkashaWorldConfigExtension{
  id
