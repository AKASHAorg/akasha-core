  createdAt
  worldConfigID
  extensionID
  extension {
    name
    displayName
    author {
      id
    }
    logoImage {
      src
      width
      height
    }
  }
  creator {
    id
  }
}

mutation CreateWorld($i: SetAkashaWorldInput!){
  setAkashaWorld(input: $i){
    document {
      ...AkashaWorldFragmentM
    }
    clientMutationId
  }
}

mutation UpdateWorld($i: UpdateAkashaWorldInput!){
  updateAkashaWorld(input: $i){
    document {
